buildscript {
    repositories {
        mavenLocal()
        maven {
            url "https://nexus.finmatica.it/repository/maven-public"
        }
    }
    dependencies {
        classpath 'it.finmatica.gradle:gradle-ci-plugin:2.0-SNAPSHOT'
    }
}

apply plugin: 'groovy'
apply plugin: 'fin.gradle-ci-plugin'

sourceCompatibility = '1.7'
targetCompatibility = '1.7'

String springBootVersion = "1.5.22.RELEASE"

configurations {
    integrationTestCompile.extendsFrom testCompile
    integrationTestRuntime.extendsFrom testRuntime
}

configurations {
    all {
        resolutionStrategy.force 'it.finmatica.spring:finmatica-zk:3.0.0.1',
                'it.finmatica.spring:finmatica-gorm:1.3',
                'it.finmatica.spring:finmatica-multiente:1.0'
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ["src/groovy", "src/java", "src/dto", "grails-app/actions", "grails-app/controllers", "grails-app/domain", "grails-app/services", "grails-app/viewmodels", "grails-app/views"]
        }
    }

    test {
        groovy {
            srcDirs = ["test/unit"]
        }

        resources {
            srcDirs = ["test/resources"]
        }
    }

    integrationTest {
        groovy {
            compileClasspath += main.output
            runtimeClasspath += main.output
            srcDirs = ["test/integration", "test/commons"]
        }

        resources {
            srcDirs = ["test/resources"]
        }
    }
}

jar {
    from('grails-app/zul') {
        into 'META-INF/zul'
    }
}

tasks.withType(JavaExec) {
    if (project.hasProperty('jvmArgs')) {
        jvmArgs = (project.jvmArgs.split("\\s+") as List)
    }
}

task integrationTest(type: Test, group: 'verification') {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    if (project.hasProperty('jvmArgs')) {
        jvmArgs = (project.jvmArgs.split("\\s+") as List)
    }
}

test.finalizedBy(integrationTest)

configurations {
    compile {
        exclude module: 'commons-fileupload'
        exclude module: 'DMServer'
    }
}

dependencies {

    compile("it.finmatica.spring:finmatica-amministrazione-database-dto:4.5.12.4"){
        exclude module: 'itext'
        exclude module: 'itextpdf'
    }
    compile("it.finmatica.spring:finmatica-amministrazione-database:4.5.12.5"){
        exclude module: 'itext'
        exclude module: 'itextpdf'
    }
