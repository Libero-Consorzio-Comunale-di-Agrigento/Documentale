buildscript {
    repositories {
        maven {
            url "https://nexus.finmatica.it/repository/maven-public/"
        }
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:1.5.12.RELEASE")
        classpath('org.springframework:springloaded:1.2.6.RELEASE')
    }
}

apply plugin: 'org.springframework.boot'
apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'war'

sourceCompatibility = '1.7'
targetCompatibility = '1.7'

springBoot {
    mainClass = 'it.finmatica.test.Application'
}

repositories {
    maven {
        url "https://nexus.finmatica.it/repository/maven-public/"
    }
}

dependencies {
    compile(rootProject)

    compile "it.finmatica:DMServer:3.5.0"
    runtime "com.oracle:ojdbc6:11.2.0.3"

    compile("org.springframework.boot:spring-boot-starter-web")
    compile("org.springframework.boot:spring-boot-starter-thymeleaf")
}

configurations {
    all {
        resolutionStrategy.force 'it.finmatica.spring:finmatica-zk:3.0.0.1',
                'it.finmatica.spring:finmatica-gorm:1.3',
                'it.finmatica.spring:finmatica-multiente:1.0'
    }
}

tasks.withType(JavaExec) {
    if ( project.hasProperty('jvmArgs') ) {
        jvmArgs = (project.jvmArgs.split("\\s+") as List)

    }
}


